name: Deploy Approval Play

on:
  push:
    branches: [main]
    paths:
      - "play/**"
      - ".github/workflows/deploy-play.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload play/ as site root
        uses: actions/upload-pages-artifact@v3
        with:
          path: play

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
