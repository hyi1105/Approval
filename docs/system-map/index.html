<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>System Map｜系統一眼圖</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <a class="skip" href="#map">跳到地圖</a>

  <header class="hero" id="top">
    <p class="brand">System Map</p>
    <h1 id="system-name">載入中…</h1>
    <p class="lede" id="one-liner"></p>
    <div class="hero-actions">
      <a class="btn primary" href="./sim.html">互動模擬：角色 × 情境</a>
      <button type="button" class="btn ghost" id="btn-impact" disabled>模擬：人員.部門改 SAP 且缺值</button>
      <a class="btn ghost" href="../index.html">回簽核假畫面</a>
    </div>
  </header>

  <main id="map" class="spine" aria-label="12345 系統地圖">
    <section class="block b1" data-n="1">
      <span class="num">1</span>
      <div>
        <h2>觸發故事</h2>
        <p id="story-trigger"></p>
        <p class="muted" id="story-bg"></p>
      </div>
    </section>

    <section class="block b2" data-n="2">
      <span class="num">2</span>
      <div>
        <h2>角色怎麼走</h2>
        <ol class="steps" id="steps"></ol>
        <ul class="roles" id="roles"></ul>
      </div>
    </section>

    <section class="block b3 anchor" data-n="3">
      <span class="num">3</span>
      <div>
        <h2>資料家（主錨）</h2>
        <p class="muted" id="stores"></p>
        <div class="tables" id="tables"></div>
      </div>
    </section>

    <section class="block b4" data-n="4">
      <span class="num">4</span>
      <div>
        <h2>欄位權限瀑布</h2>
        <div class="waterfall-wrap">
          <table class="waterfall" id="waterfall">
            <thead>
              <tr>
                <th>欄位</th>
                <th>來源</th>
                <th id="wh-steps"></th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </section>

    <section class="block b5" data-n="5">
      <span class="num">5</span>
      <div>
        <h2>變更衝擊</h2>
        <p class="muted">點上方按鈕，或點任一「來源」節點，看缺欄會炸到哪。</p>
        <ul class="impact" id="impact-list"></ul>
      </div>
    </section>
  </main>

  <footer class="foot">
    <p>地圖資料：<code>resignation.example.json</code> · Skill：<code>.cursor/skills/system-map</code></p>
  </footer>

  <script src="./map.js" type="module"></script>
</body>
</html>
